<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Saan Kits：把需求变成图示、文档和原型的 Agent 技能集。">
<title>Saan Kits</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@900&family=JetBrains+Mono:wght@400&display=swap">
<script>

if (location.hash.length > 1) location.replace('diagram/' + location.hash);
</script>
<style>
/* Compare available skills by their outputs; each row opens its skill page. */
:root{
  --paper:#F6F7F9; --ink:#1F2329; --muted:#5B6370; --line:#4E5563; --node:#E3E5EA; --node-hover:#D0D3D9; --code:#ECEEF2;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15171B; --ink:#E8EAED; --muted:#A0A7B3; --line:#A0A7B3; --node:#262A31; --node-hover:#33373F; --code:#1D2026; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15171B; --ink:#E8EAED; --muted:#A0A7B3; --line:#A0A7B3; --node:#262A31; --node-hover:#33373F; --code:#1D2026; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;padding-block:clamp(56px,14vh,128px) 64px}
h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(44px,9vw,72px);line-height:1.1}
.skill-list{list-style:none;margin:40px 0;padding:0;display:grid;border-top:1px solid var(--node-hover)}
.skill-list li{border-bottom:1px solid var(--node-hover);min-width:0}
.skill{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px 24px;padding:22px 0;color:inherit;text-decoration:none}
a.skill:hover{background:var(--node)}
.skill b{font-weight:500;font-size:22px}
.skill span{font-size:14px;color:var(--muted)}
.install{display:grid;gap:16px;margin-top:40px}
.install h2{font-size:18px;font-weight:500;margin:0}
pre{font-family:var(--f-mono);font-size:13px;line-height:1.7}
@media(max-width:560px){.skill{grid-template-columns:1fr}.skill span{font-size:13px}}
footer{margin-top:24px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 20px}
footer a{color:inherit}
</style>
<link rel="stylesheet" href="site.css">
<script src="site.js" defer></script>
</head>
<body>
<main>
  <h1>Saan Kits</h1>
  <ul class="skill-list">
    <li><a class="skill" href="diagram/"><b>Saan Diagram</b><span>HTML · SVG · PNG · 飞书画板</span></a></li>
    <li><a class="skill" href="mermaid/"><b>Saan Mermaid</b><span>Mermaid 代码 · 流程审查</span></a></li>
  </ul>
  <section class="install" aria-labelledby="install"><h2 id="install">安装</h2><div class="copy-row"><pre id="code-install"><code>npx skills add yishan/saankits</code></pre><button type="button" class="copy" data-copy="install" aria-label="复制Saan Kits安装命令" hidden>复制</button></div></section>
  <footer><a href="https://github.com/yishan/saankits">GitHub</a><span>MIT</span><span>作者 Yishan</span></footer>
</main>
</body>
</html>
