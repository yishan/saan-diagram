<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Saan Kits：把需求变成图示、文档和原型的 Agent 技能集。">

<link rel="icon" href="favicon.svg" type="image/svg+xml">

if (location.hash.length > 1) location.replace('diagram/' + location.hash);

<style>
/* Layout: 技能目录画成一棵 Saan 连线树。实线是可用，虚线是计划中，和技能本身的线型语义一致 */
:root{
  --paper:#F6F7F9; --ink:#1F2329; --muted:#5B6370; --line:#4E5563; --node:#E3E5EA; --node-hover:#D0D3D9; --code:#ECEEF2;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15171B; --ink:#E8EAED; --muted:#A0A7B3; --line:#A0A7B3; --node:#262A31; --node-hover:#33373F; --code:#1D2026; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15171B; --ink:#E8EAED; --muted:#A0A7B3; --line:#A0A7B3; --node:#262A31; --node-hover:#33373F; --code:#1D2026; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;padding-block:clamp(56px,14vh,128px) 64px}
h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(44px,9vw,72px);line-height:1.1}
.lead{margin:16px 0 0;font-size:18px;color:var(--muted);text-wrap:balance}
.tree{list-style:none;margin:40px 0 0;padding:0;display:grid}
.tree li{position:relative;padding:0 0 16px 40px;min-width:0}
/* 主干 + 单折连线 */
.tree li::before{content:"";position:absolute;left:12px;top:0;bottom:0;border-left:1.5px solid var(--line)}
.tree li::after{content:"";position:absolute;left:12px;top:32px;width:28px;border-top:1.5px solid var(--line)}
.tree li:last-child{padding-bottom:0}
.tree li:last-child::before{bottom:auto;height:32px}
.tree li.planned::before{border-left:1.5px dashed var(--muted)}
.tree li.planned::after{border-top:1.5px dashed var(--muted)}
.skill{display:grid;gap:2px;padding:12px 16px;border-radius:4px;background:var(--node);color:inherit;text-decoration:none}
a.skill:hover{background:var(--node-hover)}
a.skill:focus-visible,footer a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.skill b{font-weight:500;font-size:18px}
.skill span{font-size:14.5px;color:var(--muted)}
.planned .skill{background:none;outline:1.5px dashed var(--node-hover);outline-offset:-1.5px}
.planned .skill b{font-size:16px;font-weight:400;color:var(--muted)}
pre{margin:40px 0 0;padding:14px 16px;background:var(--code);border-radius:4px;overflow-x:auto;font-family:var(--f-mono);font-size:13.5px;line-height:1.6}
footer{margin-top:24px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 20px}
footer a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>Saan Kits</h1>
  <p class="lead">把需求变成图示、文档和原型的 Agent 技能集。</p>
  <ul class="tree">
    <li><a class="skill" href="diagram/"><b>Saan Diagram</b><span>汇报和对外交付用的业务图，可写入飞书画板</span></a></li>
    <li><a class="skill" href="mermaid/"><b>Saan Mermaid</b><span>放进文档的 Mermaid 图，并按控制点清单审查流程</span></a></li>
    <li class="planned"><div class="skill"><b>PRD 写作、原型</b><span>计划中，还不能安装</span></div></li>
  </ul>
  <pre><code>npx skills add yishan/saankits</code></pre>
  <footer><a href="https://github.com/yishan/saankits">GitHub</a><span>MIT</span><span>作者 Yishan</span></footer>
</main>
</body>
</html>
