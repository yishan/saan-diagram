# 示例 4 · 泳道图：列 = 角色，自上而下 = 时间
title: 公开招标协作泳道
desc: 需求部门、采购部门、供应商、评审专家、财务部门在一次公开招标中的分工与交接。
columns:
  - {id: dept,   label: 需求部门, lanes: 1}
  - {id: buy,    label: 采购部门, lanes: 1}
  - {id: vendor, label: 供应商, lanes: 1}
  - {id: expert, label: 评审专家, lanes: 1}
  - {id: fin,    label: 财务部门, lanes: 1}
nodes:
  - {label: 提交需求, col: dept, row: 0.4}
  - {label: 审核立项, kind: hub, col: buy, row: 2.0}
  - {label: 发布公告, col: buy, row: 3.6}
  - {label: 投标报价, col: vendor, row: 5.2}
  - {label: 评审打分, col: expert, row: 6.8, core: true}
  - {id: ok, label: 结果有效？, kind: decision, col: buy, row: 8.4}
  - {label: 签订合同, col: vendor, row: 10.0}
  - {label: 履约验收, col: dept, row: 11.6}
  - {label: 支付货款, kind: hub, col: fin, row: 13.2}
edges:
  - {from: 提交需求, to: 审核立项, kind: flow, route: vh}
  - {from: 审核立项, to: 发布公告, kind: flow}
  - {from: 发布公告, to: 投标报价, kind: flow, route: vh}
  - {from: 投标报价, to: 评审打分, kind: flow, route: vh}
  - {from: 评审打分, to: ok, kind: flow, route: vhv}
  - {from: ok, to: 签订合同, kind: flow, route: hv, label: 是, label_at: end}
  - {from: ok, to: 发布公告, kind: return, route: ll, offset: 16, label: 否·重招}
  - {from: 签订合同, to: 履约验收, kind: flow, route: vh}
  - {from: 履约验收, to: 支付货款, kind: data, route: vh, label: 验收单}

# 路径验证：评审与立项不能是同一角色；签合同前必经评审
verify:
  end: [履约验收]
  must_pass:
    - {before: 签订合同, through: [评审打分, ok]}
  separate:
    - [审核立项, 评审打分]
