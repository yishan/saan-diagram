  - {label: 解密开标,     col: proc, lane: 0.5, row: 3.0, sub: P2}
  - {label: 评审打分,     col: proc, lane: 0.5, row: 5.4, sub: P3, core: true}
  - {label: 生成评标报告, col: proc, lane: 0.5, row: 7.8, sub: P4}
  - {label: 投标文件库, kind: store, col: store, lane: 0.5, row: 1.8, sub: D1}
  - {label: 开标记录,   kind: store, col: store, lane: 0.5, row: 4.2, sub: D2}
