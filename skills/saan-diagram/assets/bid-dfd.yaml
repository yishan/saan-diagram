# 数据流图示例（profile: dfd）：处理与存储交替，外部实体在两侧
title: 电子投标数据流
desc: 供应商投标文件从递交、开标、评审到形成评标报告的数据流，含外部实体、处理过程与数据存储。
profile: dfd
columns:
