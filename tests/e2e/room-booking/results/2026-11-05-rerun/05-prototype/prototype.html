<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>会议室预约与改期 · 评审原型</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: var(--font_size)/1.6 "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
#p-bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 6px 16px; background: var(--surface); border-bottom: 1px dashed var(--border); font-size: 12px; color: var(--muted); }
#p-bar label { display: flex; gap: 6px; align-items: center; }
#p-bar select { padding: 2px 4px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
#p-bar .p-tag-review { margin-right: auto; font-weight: 600; }
#p-nav { display: flex; gap: 4px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
#p-nav button { padding: 10px 14px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; color: var(--muted); }
#p-nav button[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
#p-main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
.p-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.p-h { margin: 0 0 12px; font-size: 1.15em; }
.p-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.p-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.p-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent_text); }
.p-btn.danger { color: var(--danger); }
.p-btn:disabled { opacity: .5; cursor: not-allowed; }
.p-field { display: grid; gap: 4px; margin-bottom: 12px; }
.p-field > span { color: var(--muted); font-size: .9em; }
.p-field input, .p-field select, .p-field textarea { padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.p-table { width: 100%; border-collapse: collapse; }
.p-table th, .p-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.p-table th { color: var(--muted); font-weight: 500; }
.p-tag { display: inline-block; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; font-size: .85em; }
.p-timeline { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(28px, 1fr); gap: 2px; }
.p-slot { min-height: 34px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg); font-size: 12px; padding: 2px 4px; overflow: hidden; }
.p-slot.busy { background: var(--accent); color: var(--accent_text); border-color: var(--accent); }
button.p-slot { cursor: pointer; text-align: left; }
.p-empty { padding: 32px; text-align: center; color: var(--muted); }
.p-flash { padding: 10px 12px; margin-bottom: 16px; border: 1px solid currentColor; border-radius: var(--radius); background: var(--surface); }
.p-flash.error { color: var(--danger); }
.p-flash.ok { color: var(--text); }
.p-dialog { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(0, 0, 0, .35); }
.p-dialog > div { width: min(440px, 92vw); background: var(--surface); border-radius: var(--radius); padding: 20px; }
.p-pending { padding: 10px 12px; border: 1px dashed var(--notice); border-radius: var(--radius); color: var(--notice); }
/* review annotations */
.p-badge { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 3px; font-size: 11px; line-height: 16px; vertical-align: middle; cursor: help; border: 1px solid; background: var(--surface); }
.p-badge.proposal { color: var(--notice); }
.p-badge.open { color: var(--danger); cursor: pointer; }
.p-badge.rule { color: var(--muted); }
[data-proposal] { text-decoration: underline dotted var(--notice); text-underline-offset: 3px; }
body.p-review-off .p-badge, body.p-review-off .p-review-only { display: none; }
body.p-review-off [data-proposal] { text-decoration: none; }
#p-pop { position: fixed; z-index: 30; max-width: 360px; padding: 10px 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0, 0, 0, .18); font-size: 12px; }

</style>
</head>

"FR-B01": "FR-B01 | 员工提交新建预约 | 每次预约仅包含一间会议室、一个日期、一个时段 | — | 不支持周期、多会议室预约（范围外）", "FR-L01": "FR-L01 | 员工进入「我的预约」 | 返回创建人为当前登录员工的预约，含有效与「已取消」 | 只读 | 无预约时显示空状态〔建议：「暂无预约」〕", "FR-L02": "FR-L02 | 预约已被取消（预约人或管理员取消） | 记录仍保留在「我的预约」中 | 状态为「已取消」 | 显示「已取消」", "FR-R01": "FR-R01 | 预约人提交改期 | 改期内容仅限会议室、日期、时段；请求中携带的主题变更不生效 | 主题保持不变 | —", "FR-X01": "FR-X01 | 预约人提交取消 | 校验：本人创建、有效、尚未开始 | — | —", "FR-L03": "FR-L03 | 计算可操作项 | 仅当预约为有效且尚未开始时，可改期、可取消 | — | 「已取消」、已经开始的预约不提供改期与取消", "FR-R04": "FR-R04 | 冲突判断 | 按 FR-C04 判断目标与同一目标会议室中其他有效预约是否冲突；原预约自身的占用不计入 | — | 例：原 09:00—10:00 改为同室 09:30—10:30，不因原占用而冲突", "FR-R03": "FR-R03 | 目标不符合 FR-C02，或目标会议室停用（FR-C07） | 拒绝改期 | 原预约的会议室、日期、时段和有效状态不变 | 对应提示〔建议〕", "FR-R07": "FR-R07 | 管理员改期 | 管理员只能按 FR-R01—FR-R06 改期本人创建的预约；不能改期他人预约 | 他人预约不变 | 不向管理员提供他人预约的改期操作；服务端拒绝", "FR-X04": "FR-X04 | 取消成功后 | 记录保留在「我的预约」 | 不删除预约 | 显示「已取消」", "FR-M03": "FR-M03 | 取消原因为空 | 拒绝取消 | 预约不变 | 提示原因必填〔建议〕；纯空格是否视为空待确认（Q-25）", "FR-M05": "FR-M05 | 管理员操作本人创建的预约 | 按 4.2.3、4.2.4 预约人规则处理 | — | 本人预约位于所管会议室时，走哪条取消路径、是否需填原因见 Q-26"}}</script>
<script>
/* Saan Prototype runtime: review bar, annotations, roles, scenarios, themes. */
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("p-data").textContent);
  var pages = [], actions = {};
  var S = { scenario: null, role: null, now: null, data: null, page: null, flash: null, dialog: null,
            review: true, theme: D.theme };
  var KIND = { proposal: "建议", open: "待确认", rule: "规则" };

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function role() { return D.roles.filter(function (r) { return r.id === S.role; })[0] || D.roles[0]; }
  function visible() {
    return pages.filter(function (p) { return !p.roles || p.roles.indexOf(S.role) >= 0; });
  }
  function inNav(p) { return p.nav !== false; }
  function ctx() {
    return {
      data: S.data, role: role(), now: S.now, rules: Proto.rules, scenario: S.scenario, esc: esc,
      go: function (id) { S.page = id; S.flash = null; },
      flash: function (text, opt) { S.flash = Object.assign({ text: text, kind: "ok" }, opt || {}); },
      dialog: function (html) { S.dialog = html; },
      close: function () { S.dialog = null; }
    };
  }
  function attrs(opt) {
    var out = "";
    ["proposal", "open", "rule"].forEach(function (k) { if (opt && opt[k]) out += " data-" + k + '="' + esc(opt[k]) + '"'; });
    return out;
  }
  function applyTheme() {
    var t = D.themes[S.theme] || D.themes[Object.keys(D.themes)[0]];
    Object.keys(t).forEach(function (k) { if (k !== "label") document.documentElement.style.setProperty("--" + k, t[k]); });
  }
  function option(value, label, current) {
    return '<option value="' + esc(value) + '"' + (value === current ? " selected" : "") + ">" + esc(label) + "</option>";
  }
  function bar() {
    var sc = D.scenarios.map(function (s) {
      return option(s.id, s.label + (s.acceptance && s.acceptance.length ? "（" + s.acceptance.join("、") + "）" : ""), S.scenario.id);
    }).join("");
    var ro = D.roles.map(function (r) { return option(r.id, r.label, S.role); }).join("");
    var th = Object.keys(D.themes).map(function (k) { return option(k, D.themes[k].label || k, S.theme); }).join("");
    document.getElementById("p-bar").innerHTML =
      '<span class="p-tag-review">评审原型 · 示例数据为虚构</span>' +
      '<label>场景 <select data-bar="scenario">' + sc + "</select></label>" +
      '<label>角色 <select data-bar="role">' + ro + "</select></label>" +
      '<label>主题 <select data-bar="theme">' + th + "</select></label>" +
      '<label><input type="checkbox" data-bar="review"' + (S.review ? " checked" : "") + "> 标注</label>" +
      "<span>当前时间 " + esc(new Intl.DateTimeFormat(D.language, { timeZone: D.timezone, dateStyle: "medium", timeStyle: "short" }).format(S.now)) +
      "（" + esc(D.timezone) + "）</span>";
  }
  function decorate(root) {
    ["proposal", "open", "rule"].forEach(function (k) {
      root.querySelectorAll("[data-" + k + "]").forEach(function (el) {
        var done = el.__badged || (el.__badged = {});
        el.getAttribute("data-" + k).split(/\s+/).filter(Boolean).forEach(function (id) {
          if (done[id]) return;  // the same ID as proposal and rule gets one badge
          done[id] = true;
          var b = document.createElement("span");
          b.className = "p-badge " + k;
          b.textContent = (k === "proposal" ? "建议 " : "") + id;
          b.setAttribute("data-def", id);
          b.title = KIND[k] + " · " + id + "\n" + (D.defs[id] || "来源中未找到该编号");
          el.appendChild(b);
        });
      });
    });
  }
  function render() {
    document.getElementById("p-pop").hidden = true;  // its badge is about to be replaced
    applyTheme();
    document.body.classList.toggle("p-review-off", !S.review);
    bar();
    var vis = visible();
    if (!vis.some(function (p) { return p.id === S.page; })) {
      var first = vis.filter(inNav)[0] || vis[0];
      S.page = first ? first.id : null;
    }
    document.getElementById("p-nav").innerHTML = vis.filter(inNav).map(function (p) {
      return '<button data-go="' + esc(p.id) + '"' + (p.id === S.page ? ' aria-current="page"' : "") + attrs(p) + ">" + esc(p.label) + "</button>";
    }).join("");
    var page = vis.filter(function (p) { return p.id === S.page; })[0];
    var html = S.flash ? '<div class="p-flash ' + esc(S.flash.kind) + '"' + attrs(S.flash) + ">" + esc(S.flash.text) + "</div>" : "";
    html += page ? page.render(ctx()) : '<div class="p-empty">当前角色没有可见页面</div>';
    if (S.dialog) html += '<div class="p-dialog"><div>' + S.dialog + "</div></div>";
    var main = document.getElementById("p-main");
    main.innerHTML = html;
    decorate(document.getElementById("p-nav"));
    decorate(main);
  }
  function load(id) {
    var sc = D.scenarios.filter(function (s) { return s.id === id; })[0] || D.scenarios[0];
    S.scenario = sc; S.role = sc.role || D.roles[0].id; S.now = new Date(sc.now || Date.now());
    S.data = JSON.parse(JSON.stringify(sc.data || {})); S.flash = null; S.dialog = null;
    if (sc.page) S.page = sc.page;
    render();
  }
  function popover(badge) {
    var pop = document.getElementById("p-pop"), r = badge.getBoundingClientRect(), id = badge.getAttribute("data-def");
    pop.innerHTML = "<strong>" + esc(id) + "</strong><br>" + esc(D.defs[id] || "来源中未找到该编号");
    pop.style.left = Math.min(r.left, innerWidth - 380) + "px";
    pop.style.top = (r.bottom + 6) + "px";
    pop.hidden = false;
  }
  function run(name, el, extra) {
    var fn = actions[name];
    if (!fn) { S.flash = { text: "原型未实现动作：" + name, kind: "error" }; return render(); }
    S.flash = null;  // a new action replaces the previous message
    fn(ctx(), Object.assign({}, el.dataset, extra || {}), el);
    render();
  }

  document.addEventListener("click", function (e) {
    var pop = document.getElementById("p-pop");
    var badge = e.target.closest(".p-badge.open");
    if (badge) { e.preventDefault(); e.stopPropagation(); return popover(badge); }
    pop.hidden = true;
    var go = e.target.closest("[data-go]");
    if (go) { S.page = go.getAttribute("data-go"); S.flash = null; S.dialog = null; return render(); }
    var act = e.target.closest("button[data-action], a[data-action]");
    if (act && !act.disabled) { e.preventDefault(); run(act.getAttribute("data-action"), act); }
  });
  document.addEventListener("submit", function (e) {
    var form = e.target.closest("form[data-action]");
    if (!form) return;
    e.preventDefault();
    var fields = {};
    new FormData(form).forEach(function (v, k) { fields[k] = v; });
    run(form.getAttribute("data-action"), form, { fields: fields });
  });
  document.addEventListener("change", function (e) {
    var k = e.target.getAttribute("data-bar");
    if (!k) {
      var field = e.target.closest("input[data-action], select[data-action]");
      if (field) run(field.getAttribute("data-action"), field, { value: field.type === "checkbox" ? field.checked : field.value });
      return;
    }
    if (k === "scenario") return load(e.target.value);
    if (k === "role") { S.role = e.target.value; S.flash = null; S.dialog = null; }
    if (k === "theme") S.theme = e.target.value;
    if (k === "review") S.review = e.target.checked;
    render();
  });

  window.Proto = {
    rules: {},
    page: function (id, def) { pages.push(Object.assign({ id: id }, def)); },
    action: function (name, fn) { actions[name] = fn; },
    start: function () { load(D.scenarios[0] && D.scenarios[0].id); },
    esc: esc
  };
})();

</script>
<script>
/* Confirmed rules only (source.md 第 4 章). Each function is pure and names the rule it implements.
   Dates are "YYYY-MM-DD", times "HH:mm", all in Asia/Shanghai (FR-C01).
   Open questions are not decided here: startState "at" (Q-07) comes back as the code "boundary",
   and pages handle whitespace-only text (Q-05, Q-25) before calling; both end in a pending message. */
(function (R) {
  function toMin(t) {
    var m = /^(\d{2}):(\d{2})$/.exec(t || "");
    return m ? Number(m[1]) * 60 + Number(m[2]) : NaN;
  }
  R.toMin = toMin;

  // FR-C01: a booking's start instant, read in Asia/Shanghai (+08:00)
  R.startsAt = function (b) { return new Date(b.date + "T" + b.start + ":00+08:00"); };

  // FR-C02 (FR-C03 boundaries follow): one date per booking (FR-B01), half-hour ticks,
  // start >= 09:00, end <= 18:00, start earlier than end
  R.timeValid = function (f) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date || "")) return false;
    var s = toMin(f.start), e = toMin(f.end);
    if (isNaN(s) || isNaN(e)) return false;
    return s % 30 === 0 && e % 30 === 0 && s >= 9 * 60 && e <= 18 * 60 && s < e;
  };

  // FR-C04: occupancy is [start, end); same room and same date; touching ends do not overlap
  R.overlaps = function (a, b) {
    return a.room === b.room && a.date === b.date &&
      toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);
  };
  // FR-C04, FR-R04: only valid ("有效") bookings count; the booking being rescheduled is ignored
  R.conflict = function (bookings, target, ignoreId) {
    return bookings.some(function (b) { return b.status === "有效" && b.id !== ignoreId && R.overlaps(b, target); });
  };

  // FR-C07: only enabled rooms can be booked or used as a reschedule target
  R.roomEnabled = function (room) { return !!room && room.enabled === true; };

  // 4.3: room administrator. Where this mapping comes from is Q-01; the prototype reads room.admins
  R.isAdminOf = function (room, roleId) { return !!room && (room.admins || []).indexOf(roleId) >= 0; };

  // FR-V02: the booker and the room's administrator see the topic; everyone else sees 「已占用」
  R.canSeeTopic = function (b, room, roleId) { return b.owner === roleId || R.isAdminOf(room, roleId); };

  // FR-R02, FR-X02, FR-M02: "before" | "at" | "after" the start time. Whether "at" counts as started is Q-07.
  R.startState = function (b, now) {
    var d = R.startsAt(b).getTime() - now.getTime();
    return d > 0 ? "before" : d === 0 ? "at" : "after";
  };

  // FR-L03 (FR-R02, FR-X01): own, valid, not yet started
  R.canChange = function (b, roleId, now) {
    return b.owner === roleId && b.status === "有效" && R.startState(b, now) === "before";
  };

  // FR-M01: another person's booking in a room this admin manages, valid, not yet started (own bookings: FR-M05)
  R.canAdminCancel = function (b, room, roleId, now) {
    return b.owner !== roleId && R.isAdminOf(room, roleId) && b.status === "有效" && R.startState(b, now) === "before";
  };

  // FR-B03, FR-B04 (FR-C02, FR-C07), FR-B06 (FR-C04). Returns a problem code or null.
  R.bookingProblem = function (f, room, bookings) {
    if (!f.topic) return "topic";
    if (!R.timeValid(f)) return "time";
    if (!R.roomEnabled(room)) return "room";
    if (R.conflict(bookings, f, null)) return "conflict";
    return null;
  };

  // FR-X05, FR-R02, FR-R03, FR-R04, FR-R06. Returns a problem code or null.
  R.rescheduleProblem = function (b, f, targetRoom, bookings, roleId, now) {
    if (b.status === "已取消") return "cancelled";
    if (b.owner !== roleId) return "notOwner";
    var st = R.startState(b, now);
    if (st === "at") return "boundary";
    if (st === "after") return "started";
    if (!R.timeValid(f)) return "time";
    if (!R.roomEnabled(targetRoom)) return "room";
    if (R.conflict(bookings, f, b.id)) return "conflict";
    return null;
  };

  // FR-X01, FR-X02, FR-X05. Returns a problem code or null.
  R.cancelProblem = function (b, roleId, now) {
    if (b.status === "已取消") return "cancelled";
    if (b.owner !== roleId) return "notOwner";
    var st = R.startState(b, now);
    if (st === "at") return "boundary";
    if (st === "after") return "started";
    return null;
  };

  // FR-M01, FR-M02, FR-M03. Returns a problem code or null.
  R.adminCancelProblem = function (b, room, roleId, now, reason) {
    if (b.status === "已取消") return "cancelled";
    if (!R.isAdminOf(room, roleId)) return "notAdmin";
    var st = R.startState(b, now);
    if (st === "at") return "boundary";
    if (st === "after") return "started";
    if (!reason) return "reason";
    return null;
  };
})(Proto.rules);

</script>
<script>

/* 共用：时间、选项、反馈文案、对话框与提交处理。每个提交都在动作里重新校验（FR-C06）。 */
var RB = (function () {
  var RB = { handlers: {} }, esc = Proto.esc;
  RB.SLOTS = [];
  for (var m = 9 * 60; m < 18 * 60; m += 30) RB.SLOTS.push(m);
  RB.hm = function (min) { return ("0" + Math.floor(min / 60)).slice(-2) + ":" + ("0" + (min % 60)).slice(-2); };
  function sh(d) { return new Date(d.getTime() + 8 * 3600000).toISOString(); }  // FR-C01 Asia/Shanghai
  RB.today = function (c) { return sh(c.now).slice(0, 10); };
  RB.stamp = function (d) { var s = sh(d); return s.slice(0, 10) + " " + s.slice(11, 16); };
  RB.day = function (c) { return c.data.day || RB.today(c); };
  RB.room = function (c, id) { return (c.data.rooms || []).filter(function (r) { return r.id === id; })[0] || null; };
  RB.roomName = function (c, id) { var r = RB.room(c, id); return r ? r.name : id; };
  RB.booking = function (c, id) { return (c.data.bookings || []).filter(function (b) { return b.id === id; })[0] || null; };
  RB.manages = function (c) { return (c.data.rooms || []).some(function (r) { return c.rules.isAdminOf(r, c.role.id); }); };
  RB.enabledRooms = function (c) { return c.data.rooms.filter(function (r) { return c.rules.roomEnabled(r); }); };

  function opts(list, cur) {

  RB.endOptions = function (cur) { return opts(RB.SLOTS.map(function (m) { return [RB.hm(m + 30), RB.hm(m + 30)]; }), cur); };
  RB.roomOptions = function (c, cur) {
    return opts(RB.enabledRooms(c).map(function (r) { return [r.id, r.name + "（容量 " + r.capacity + " 人）"]; }), cur);

  /* 反馈文案。来源只给出部分建议文案；其余为本原型的建议，一律标 proposal。 */

      started: { text: "该预约当前不可取消", kind: "error", proposal: "FR-X02" },
      boundary: { text: "恰好到开始时刻是否算“已经开始”，尚待确认；原型不执行取消", kind: "error", open: "Q-07" }
    },
    admin: {
      cancelled: { text: "该预约当前不可取消", kind: "error", proposal: "FR-M02" },
      notAdmin: { text: "该预约当前不可取消", kind: "error", proposal: "FR-M02" },
      started: { text: "该预约当前不可取消", kind: "error", proposal: "FR-M02" },
      boundary: { text: "恰好到开始时刻是否算“已经开始”，尚待确认；原型不执行取消", kind: "error", open: "Q-07" },
      reason: { text: "请填写取消原因", kind: "error", proposal: "FR-M03" },

      own: { text: "管理员取消本人在所管会议室的预约走哪条路径，尚待确认；原型不执行此操作", kind: "error", open: "Q-26" }
    },

      cancelled: { text: "预约已取消", proposal: "FR-X03", open: "Q-10" },

  };
  RB.say = function (c, group, key) { var m = RB.MSG[group][key]; c.flash(m.text, m); };

  /* 评审辅助：不属于界面。演示绕过界面直接提交时的校验，以及数据层的取消记录。 */
  RB.extras = function (c) {

          return '<button class="p-btn" data-action="probe" data-i="' + i + '">' + esc(p.label) + "</button>";

    }
    var cancelled = (c.data.bookings || []).filter(function (b) { return b.status === "已取消"; });
    if (cancelled.length) {
      out += '<section class="p-card p-review-only"><h2 class="p-h" data-rule="FR-X03 FR-M04">评审辅助：取消记录（数据层）</h2>' +

        '<table class="p-table"><thead><tr><th>预约</th><th>取消操作人</th><th>取消时间</th><th>取消原因</th></tr></thead><tbody>' +
        cancelled.map(function (b) {
          return "<tr><td>" + esc(RB.roomName(c, b.room) + " " + b.date + " " + b.start + "—" + b.end) + "</td><td>" +
            esc(b.cancelByLabel || b.cancelBy || "") + "</td><td>" + esc(b.cancelAt || "") + "</td><td>" +
            esc(b.cancelReason || "—") + "</td></tr>";
        }).join("") + "</tbody></table></section>";
    }
    return out;
  };

  function summary(c, b) {
    return '<table class="p-table"><tbody>' +
      "<tr><th>会议室</th><td>" + esc(RB.roomName(c, b.room)) + "</td></tr>" +
      "<tr><th>日期</th><td>" + esc(b.date) + "</td></tr>" +
      "<tr><th>时间</th><td>" + esc(b.start + "—" + b.end) + "</td></tr>" +

  // 占用块详情：只有预约人和该会议室管理员能打开（FR-V02）

    if (!own && admin) html += '<p class="p-pending p-review-only" data-open="Q-19">管理员是否能看到预约人待定；原型不显示预约人</p>';

  RB.cancelDialog = function (c, b) {

    return '<h2 class="p-h" data-proposal="FR-X03">确定取消该预约？</h2>' + summary(c, b) +
      (own && admin ? '<p class="p-pending p-review-only" data-open="Q-26">管理员取消本人在所管会议室的预约是否需要填写原因待定</p>' : "") +

  };

  RB.adminDialog = function (c, b, err) {
    var msg = err === "reason" ? '<div class="p-flash error" data-proposal="FR-M03">请填写取消原因</div>'
      : err === "blank" ? '<div class="p-flash error" data-open="Q-25">取消原因只有空格时是否算未填写，尚待确认；原型不执行取消</div>' : "";
    return '<h2 class="p-h" data-proposal="FR-M04">取消该预约</h2>' + summary(c, b) +
      '<form data-action="adminCancel" data-id="' + esc(b.id) + '" style="margin-top:12px">' +
      '<label class="p-field"><span data-rule="FR-M03">取消原因 *</span><textarea name="reason" rows="3"></textarea></label>' +
      '<p class="p-pending p-review-only" data-open="Q-25">原因长度上限、只有空格是否算未填写待定</p>' + msg +
      '<div class="p-row"><button class="p-btn danger" data-proposal="FR-M04">确认取消</button>' +
      '<button type="button" class="p-btn" data-action="closeDialog">返回</button></div></form>';
  };

  /* 提交处理。a.probe 为真时来自评审辅助的直接请求：不改表单草稿，不跳转。 */
  RB.handlers.book = function (c, a) {
    var f = a.fields || {};
    if (!a.probe) c.data.draft = Object.assign({}, f);
    if (f.topic && !f.topic.trim()) return RB.say(c, "book", "blank");
    var why = c.rules.bookingProblem(f, RB.room(c, f.room), c.data.bookings);
    if (why) return RB.say(c, "book", why);
    // FR-B02: the creator is the current user; any creator sent in the request (f.owner) is ignored
    c.data.bookings.push({ id: "n" + (c.data.bookings.length + 1), room: f.room, date: f.date, start: f.start, end: f.end,
      topic: f.topic, owner: c.role.id, status: "有效" });
    if (!a.probe) { c.data.draft = null; c.data.day = f.date; c.go("rooms"); }
    RB.say(c, "done", "booked");  // after c.go, which clears the message
  };

  RB.handlers.reschedule = function (c, a) {
    var b = RB.booking(c, a.id), f = a.fields || {};
    if (!a.probe) c.data.edit = Object.assign({ id: a.id }, f);
    if (!b) return RB.say(c, "resched", "notOwner");
    var why = c.rules.rescheduleProblem(b, f, RB.room(c, f.room), c.data.bookings, c.role.id, c.now);
    if (why === "notOwner" && c.rules.isAdminOf(RB.room(c, b.room), c.role.id)) why = "adminOther";
    if (!why && f.room === b.room && f.date === b.date && f.start === b.start && f.end === b.end) why = "same";
    if (why) return RB.say(c, "resched", why);
    b.room = f.room; b.date = f.date; b.start = f.start; b.end = f.end;  // FR-R05: topic and creator unchanged (FR-R01)
    if (!a.probe) { c.data.edit = null; c.data.day = f.date; c.go("mine"); }
    RB.say(c, "done", "rescheduled");
  };

  RB.handlers.cancel = function (c, a) {
    var b = RB.booking(c, a.id);
    var why = b ? c.rules.cancelProblem(b, c.role.id, c.now) : "notOwner";
    c.close();
    if (why) return RB.say(c, "cancel", why);
    b.status = "已取消"; b.cancelBy = c.role.id; b.cancelByLabel = c.role.label; b.cancelAt = RB.stamp(c.now);  // FR-X03
    RB.say(c, "done", "cancelled");
  };

  RB.handlers.adminCancel = function (c, a) {
    var b = RB.booking(c, a.id), reason = (a.fields || {}).reason || "";
    if (b && b.owner === c.role.id) { c.close(); return RB.say(c, "admin", "own"); }
    var why = b ? c.rules.adminCancelProblem(b, RB.room(c, b.room), c.role.id, c.now, reason) : "notAdmin";
    if (!why && !reason.trim()) why = "blank";
    if ((why === "reason" || why === "blank") && !a.probe) return c.dialog(RB.adminDialog(c, b, why));
    c.close();
    if (why) return RB.say(c, "admin", why);
    b.status = "已取消"; b.cancelBy = c.role.id; b.cancelByLabel = c.role.label;  // FR-M04
    b.cancelAt = RB.stamp(c.now); b.cancelReason = reason;
    RB.say(c, "done", "adminCancelled");
  };

  return RB;
})();

Proto.action("probe", function (c, a) {
  var p = c.data.probes[Number(a.i)];
  RB.handlers[p.action](c, { id: p.id, fields: Object.assign({}, p.fields), probe: true });
});
Proto.action("book", function (c, a) { RB.handlers.book(c, a); });
Proto.action("reschedule", function (c, a) { RB.handlers.reschedule(c, a); });
Proto.action("cancel", function (c, a) { RB.handlers.cancel(c, a); });
Proto.action("adminCancel", function (c, a) { RB.handlers.adminCancel(c, a); });
Proto.action("setDay", function (c, a) { c.data.day = a.value; });
Proto.action("closeDialog", function (c) { c.close(); });
Proto.action("pick", function (c, a) {
  var m = Number(a.min);
  c.data.draft = { room: a.room, date: RB.day(c), start: RB.hm(m), end: RB.hm(m + 30), topic: "" };
  c.go("book");
});
Proto.action("openBooking", function (c, a) {
  var b = RB.booking(c, a.id);
  if (b) c.dialog(RB.detail(c, b));
});
Proto.action("startEdit", function (c, a) {
  var b = RB.booking(c, a.id);
  if (!b) return;
  c.data.edit = { id: b.id, room: b.room, date: b.date, start: b.start, end: b.end };
  c.close();
  c.go("reschedule");
});
Proto.action("askCancel", function (c, a) { var b = RB.booking(c, a.id); if (b) c.dialog(RB.cancelDialog(c, b)); });
Proto.action("askAdminCancel", function (c, a) { var b = RB.booking(c, a.id); if (b) c.dialog(RB.adminDialog(c, b, null)); });

/* pages/rooms.js */
Proto.page("rooms", {
  label: "会议室",
  render: function (c) {
    var r = c.rules, me = c.role.id, day = RB.day(c), esc = c.esc;
    var head = '<section class="p-card"><h2 class="p-h">会议室</h2>' +
      '<div class="p-row"><label class="p-field"><span data-proposal="FR-C01">日期</span>' +
      '<input type="date" value="' + esc(day) + '" data-action="setDay"></label>' +
      '<span data-proposal="FR-V01">点击空闲格发起新建预约</span></div>' +
      '<p class="p-pending p-review-only" data-open="Q-20">停用的会议室是否在此展示、如何标识待定；原型暂不列出停用会议室</p>' +
      (RB.manages(c)
        ? '<p class="p-pending p-review-only" data-open="Q-01">管理员与会议室的对应关系来源待定；示例数据假设管理员 M 负责会议室 A</p>' +
          '<p class="p-pending p-review-only" data-open="Q-24">管理员执行取消的位置待定；原型暂放在所管会议室的占用块上</p>'
        : "") + "</section>";

    var scale = '<div class="p-timeline" aria-hidden="true">' + RB.SLOTS.map(function (m) {
      return '<div style="font-size:11px;color:var(--muted)">' + (m % 60 ? "" : RB.hm(m)) + "</div>";
    }).join("") + "</div>";

    var rooms = RB.enabledRooms(c).map(function (room) {
      // FR-V01: valid bookings of this room on the chosen day; cancelled ones are not occupancy
      var list = c.data.bookings.filter(function (b) { return b.status === "有效" && b.room === room.id && b.date === day; });
      var cells = [], m = 9 * 60;
      while (m < 18 * 60) {
        var b = list.filter(function (x) { return r.toMin(x.start) <= m && m < r.toMin(x.end); })[0];
        if (b) {
          var end = r.toMin(b.end), span = (end - m) / 30, when = b.start + "—" + b.end;
          cells.push(r.canSeeTopic(b, room, me)
            ? '<button class="p-slot busy" style="grid-column: span ' + span + '" data-action="openBooking" data-id="' +
              esc(b.id) + '" data-rule="FR-V02" title="' + esc(when) + '">' + esc(b.topic) + "</button>"
            : '<div class="p-slot busy" style="grid-column: span ' + span + '" data-rule="FR-V02" title="' + esc(when) + '">已占用</div>');
          m = end;
        } else {
          cells.push('<button class="p-slot" data-action="pick" data-room="' + esc(room.id) + '" data-min="' + m +
            '" title="' + RB.hm(m) + '" aria-label="' + esc(room.name + " " + RB.hm(m) + " 空闲") + '"></button>');
          m += 30;
        }
      }
      return '<section class="p-card"><h2 class="p-h">' + esc(room.name) + ' <span class="p-tag">容量 ' + esc(room.capacity) + " 人</span></h2>" +
        scale + '<div class="p-timeline">' + cells.join("") + "</div></section>";
    }).join("");

    return head + rooms + RB.extras(c);
  }
});

      '<div class="p-row">' +

      "</div>" +

      '<label class="p-field"><span data-rule="FR-B03">会议主题 *</span><input name="topic" value="' + esc(d.topic) + '"></label>' +
      '<p class="p-pending p-review-only" data-open="Q-05">主题长度上限、只有空格是否算未填写待定</p>' +
      '<div class="p-field"><span>创建人</span><div data-proposal="FR-B02">' + esc(c.role.label) + "</div></div>" +
      '<p class="p-pending p-review-only" data-open="Q-13">同一员工同一时段能否持有不同会议室的预约待定；原型按同一会议室判断冲突</p>' +
      '<div class="p-row"><button class="p-btn primary" data-proposal="FR-B05">提交预约</button>' +
      '<button type="button" class="p-btn" data-go="rooms" data-proposal="FR-V01">返回会议室</button></div>' +
      '<p class="p-pending p-review-only" data-open="Q-11" style="margin-top:12px">防止重复点击、超时重试的方式待定</p>' +
      "</form>" + RB.extras(c);
  }
});

/* pages/mine.js */
Proto.page("mine", {
  label: "我的预约",
  render: function (c) {
    var r = c.rules, me = c.role.id, esc = c.esc;
    // FR-L01: bookings created by the current user, valid and cancelled. Order: proposal (Q-21)
    var list = c.data.bookings.filter(function (b) { return b.owner === me; }).slice().sort(function (a, b) {
      return (b.date + b.start).localeCompare(a.date + a.start);
    });
    var head = '<section class="p-card"><h2 class="p-h">我的预约</h2>';
    if (!list.length) return head + '<div class="p-empty" data-proposal="FR-L01">暂无预约</div></section>' + RB.extras(c);
    var rows = list.map(function (b) {
      var st = r.startState(b, c.now), status, acts;
      if (b.status === "已取消") {
        status = '<span class="p-tag" data-rule="FR-L02">已取消</span>' +
          (b.cancelAt ? '<div data-proposal="FR-X03" style="font-size:12px;color:var(--muted)">取消时间 ' + esc(b.cancelAt) + "</div>" : "");
      } else if (st === "before") {
        status = '<span class="p-tag" data-proposal="FR-L02">已预约</span>';
      } else {
        status = '<span class="p-tag" data-proposal="FR-L02" data-open="Q-21">已预约</span>';
      }
      if (r.canChange(b, me, c.now)) {
        acts = '<button class="p-btn" data-action="startEdit" data-id="' + esc(b.id) + '" data-proposal="FR-L03">改期</button> ' +
          '<button class="p-btn danger" data-action="askCancel" data-id="' + esc(b.id) + '" data-proposal="FR-L03">取消预约</button>';
      } else if (b.status === "有效" && st === "at") {
        acts = '<span class="p-pending p-review-only" data-open="Q-07">恰好到开始时刻，能否改期、取消待定</span>';
      } else {
        acts = "—";
      }
      return "<tr><td>" + esc(RB.roomName(c, b.room)) + "</td><td>" + esc(b.date) + "</td><td>" + esc(b.start + "—" + b.end) +
        "</td><td>" + esc(b.topic) + "</td><td>" + status + '</td><td data-rule="FR-L03">' + acts + "</td></tr>";
    }).join("");
    return head +
      '<p data-proposal="FR-L01" style="margin:0 0 8px;font-size:12px;color:var(--muted)">按开始时间倒序</p>' +
      '<table class="p-table"><thead><tr><th>会议室</th><th>日期</th><th>时间</th><th>会议主题</th><th>状态</th><th>操作</th></tr></thead><tbody>' +
      rows + "</tbody></table>" +
      '<p class="p-pending p-review-only" data-open="Q-21" style="margin-top:12px">排序方式、有效预约的显示文案、已开始或已结束预约的显示方式待定</p>' +
      '<p class="p-pending p-review-only" data-open="Q-08">是否向预约人显示取消操作人和取消原因、取消记录保存多久待定</p>' +
      "</section>" + RB.extras(c);
  }
});

/* pages/reschedule.js */
Proto.page("reschedule", {
  label: "改期", nav: false, proposal: "FR-R05",
  render: function (c) {
    var esc = c.esc, e = c.data.edit, b = e && RB.booking(c, e.id);
    if (!b) {
      return '<section class="p-card"><div class="p-empty" data-proposal="FR-R02">未选择要改期的预约</div>' +
        '<button type="button" class="p-btn" data-go="mine" data-proposal="FR-L03">返回我的预约</button></section>' + RB.extras(c);
    }
    var original = '<section class="p-card"><h2 class="p-h" data-proposal="FR-R01">原预约</h2><table class="p-table"><tbody>' +
      "<tr><th>会议室</th><td>" + esc(RB.roomName(c, b.room)) + "</td></tr>" +
      "<tr><th>日期</th><td>" + esc(b.date) + "</td></tr>" +
      "<tr><th>时间</th><td>" + esc(b.start + "—" + b.end) + "</td></tr>" +
      '<tr><th>会议主题</th><td data-rule="FR-R01">' + esc(b.topic) + "（不可修改）</td></tr></tbody></table></section>";
    var form = '<form class="p-card" data-action="reschedule" data-id="' + esc(b.id) + '"><h2 class="p-h" data-proposal="FR-R05">改期到</h2>' +
      '<label class="p-field"><span data-rule="FR-R03">目标会议室</span><select name="room">' + RB.roomOptions(c, e.room) + "</select></label>" +
      '<label class="p-field"><span>目标日期</span><input type="date" name="date" value="' + esc(e.date) + '"></label>' +
      '<p class="p-pending p-review-only" data-open="Q-03">改期是否有提前量要求、是否与新预约相同待定；原型不做此校验</p>' +
      '<div class="p-row">' +
      '<label class="p-field"><span data-rule="FR-C02">目标开始时间</span><select name="start">' + RB.startOptions(e.start) + "</select></label>" +
      '<label class="p-field"><span data-rule="FR-C02">目标结束时间</span><select name="end">' + RB.endOptions(e.end) + "</select></label>" +
      "</div>" +
      '<p data-rule="FR-R04" style="margin:-6px 0 12px;font-size:12px;color:var(--muted)">原预约自身的占用不计入冲突</p>' +
      '<div class="p-row"><button class="p-btn primary" data-proposal="FR-R05">确认改期</button>' +
      '<button type="button" class="p-btn" data-go="mine" data-proposal="FR-L03">返回我的预约</button></div>' +
      '<p class="p-pending p-review-only" data-open="Q-15" style="margin-top:12px">改期后是否保留原会议室、原时段等变更历史待定</p>' +
      "</form>";
    return original + form + RB.extras(c);
  }
});

</script>
