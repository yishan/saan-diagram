name: Validate skill
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r skills/saan-diagram/requirements.txt
      - run: python skills/saan-diagram/scripts/render.py --selftest
      - run: python -m unittest discover -s tests -v
      - run: python scripts/render_smoke.py
  png-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/saan-diagram/requirements-png.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python scripts/render_smoke.py --png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagram-smoke
          path: out/smoke/
